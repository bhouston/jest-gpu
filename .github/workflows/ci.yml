name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }}${{ matrix.jest && format(', node {0}, jest {1}', matrix.node, matrix.jest) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        floor: [false]
        include:
          # The supported floor: engines.node >=22.12 and the jest >=29 peer range. `floor` differs
          # from the base combinations so this is added as a new leg rather than merged into one.
          - os: ubuntu-latest
            floor: true
            node: '22'
            jest: '29'
    env:
      # Software rasterizers on GPU-less runners: Mesa llvmpipe for WebGL, Dawn's Vulkan backend on lavapipe for WebGPU.
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri mesa-vulkan-drivers
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ !matrix.node && '.nvmrc' || '' }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.jest
        name: Downgrade to Jest ${{ matrix.jest }}
        run: |
          pnpm --filter jest-gpu --filter demo add -D jest@${{ matrix.jest }} jest-environment-node@${{ matrix.jest }} @jest/globals@${{ matrix.jest }} @types/jest@${{ matrix.jest }}
          pnpm exec jest --version
      - run: pnpm test:workflow
      - run: pnpm lint
      - run: pnpm tsc
      - run: pnpm test:coverage
      - run: pnpm test:cjs
      - run: pnpm test:consumer
      - run: pnpm audit --audit-level=high
      - run: pnpm package:check
      - name: Verify packed tarballs include dist
        run: |
          for pkg in packages/*/; do
            output=$(cd "$pkg" && pnpm pack --dry-run 2>&1)
            for f in dist/index.cjs dist/index.mjs; do
              echo "$output" | grep -qF "$f" || {
                echo "::error::$f missing from the packed tarball for $pkg; the publish step would ship a broken package."
                exit 1
              }
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ matrix.os }}${{ matrix.jest && format('-node{0}-jest{1}', matrix.node, matrix.jest) || '' }}
          path: |
            coverage/
      - name: Upload coverage
        if: runner.os == 'macOS' && !matrix.jest
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  policy:
    name: PR policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PR title and workflow
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
          node scripts/check-pr-policy.mjs
